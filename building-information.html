<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Building information</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1b1f24;
            --muted: #667085;
            --accent: #2563eb;
            --border: #e5e7eb;
            --shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
            --radius: 12px;
            --space: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
            line-height: 1.45;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: calc(var(--space) * 4);
        }

        .header {
            display: flex;
            gap: calc(var(--space) * 2);
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: calc(var(--space) * 3);
        }

        h1 {
            font-size: 28px;
            margin: 0 0 calc(var(--space) * 0.5) 0;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: calc(var(--space) * 1.5);
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: calc(var(--space) * 2);
            margin-bottom: calc(var(--space) * 3);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: calc(var(--space) * 2);
            box-shadow: var(--shadow);
        }

        .card h3 {
            margin: 0 0 calc(var(--space) * 0.5) 0;
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card p {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .section-title {
            font-size: 18px;
            margin: 0 0 calc(var(--space) * 2) 0;
        }

        details {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: calc(var(--space) * 2);
            margin-bottom: calc(var(--space) * 2);
        }

        summary {
            cursor: pointer;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: calc(var(--space) * 1.5);
        }

        th, td {
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        th {
            color: var(--muted);
            font-weight: 600;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            padding: 16px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .page {
                padding: calc(var(--space) * 2);
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <h1>Building information</h1>
                <div class="subtitle" id="objectSubtitle">Object number: </div>
            </div>
            <div class="actions">
                <button class="btn" id="backBtn">Back to viewer</button>
                <button class="btn btn-primary" id="downloadBtn">Download JSON</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading building data…</div>
        </div>

        <div id="content" style="display:none;">
            <h2 class="section-title">Key facts</h2>
            <div class="grid" id="factsGrid"></div>

            <h2 class="section-title">Property sets</h2>
            <div id="propertySets"></div>
        </div>

        <div id="emptyState" class="empty" style="display:none;"></div>
    </div>

    <script src="./ifc-storage.js"></script>
    <script src="./building-information.js" defer></script>
</body>
</html>
