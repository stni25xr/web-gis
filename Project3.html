<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IFC Viewer</title>
  <style>
    :root {
      color-scheme: light;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f6f8;
      font-family: "Sora", "SF Pro Text", "Inter", system-ui, -apple-system, sans-serif;
    }
    .viewer-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6f8;
    }
    .fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      color: #0f172a;
      padding: 24px;
      background: #f4f6f8;
    }
    .fallback.show {
      display: grid;
    }
    .fallback a {
      color: #2f6bff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <iframe
    id="ifcFrame"
    class="viewer-frame"
    src="https://stni25xr.github.io/IFC_reader/"
    title="IFC Reader"
    loading="lazy"
    referrerpolicy="no-referrer"
  ></iframe>
  <div id="ifcFallback" class="fallback">
    <div>
      <h1 style="margin:0 0 8px;font-size:20px;">IFC Viewer kunde inte laddas</h1>
      <p style="margin:0 0 12px;color:#475569;">Öppna den direkt i en ny flik.</p>
      <a href="https://stni25xr.github.io/IFC_reader/" target="_blank" rel="noreferrer">Öppna IFC Reader</a>
    </div>
  </div>
  <script>
    (function () {
      const frame = document.getElementById("ifcFrame");
      const fallback = document.getElementById("ifcFallback");
      let loaded = false;
      const timer = setTimeout(() => {
        if (!loaded) fallback.classList.add("show");
      }, 4000);
      frame.addEventListener("load", () => {
        loaded = true;
        clearTimeout(timer);
        fallback.classList.remove("show");
      });
    })();
  </script>
</body>
</html>
